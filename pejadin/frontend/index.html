main{flex:1;padding:30px 34px;min-width:0}.bar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.bar h2{flex:1}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 3px 12px rgba(36,48,71,.035);overflow:auto}

label{display:block;font-size:12px;font-weight:600;color:#475569}.required-mark{color:#b42318;font-weight:700}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:14px}
.money-control{display:flex;align-items:stretch;margin-top:7px;border-radius:8px}.money-prefix{display:flex;align-items:center;padding:0 12px;border:1px solid #cbd5e1;border-right:0;border-radius:8px 0 0 8px;background:#f1f4f9;color:#475569;font-weight:600}.money-control input{min-width:0;border-radius:0 8px 8px 0;margin:0!important}.money-control:focus-within{border-radius:8px;box-shadow:0 0 0 3px rgba(32,56,111,.12)}.money-control:focus-within .money-prefix,.money-control:focus-within input{border-color:var(--navy);box-shadow:none}
.auto-field{color:#315b91}

.st-summary-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.st-fact{min-width:0;padding:15px;border:1px solid #d5deec;border-radius:11px;background:#f3f6fb}

.st-fact-label{display:block;margin-bottom:11px;color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

.st-form .g{grid-template-columns:minmax(0,1fr);align-items:start;gap:14px}
#f:not(.st-form) .g{grid-template-columns:minmax(0,1fr)}
#sp>button[type=submit]{display:block;margin-left:auto}
.cost-table{width:100%;min-width:720px}

.cost-details-content dl{display:grid;grid-template-columns:minmax(120px,1fr) auto;gap:7px 14px;margin:0;font-size:12px}
.cost-details-content dt{color:var(--muted)}.cost-details-content dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

button,.btn{background:var(--yellow);color:#182d5b;border:1px solid var(--yellow);border-radius:8px;padding:10px 15px;font:700 13px Inter,sans-serif;cursor:pointer;text-decoration:none;display:inline-block;transition:filter .15s,transform .15s}button:hover,.btn:hover{filter:brightness(.96);transform:translateY(-1px)}button:focus-visible,.btn:focus-visible,a:focus-visible{outline:3px solid rgba(255,185,20,.55);outline-offset:2px}

i','Provinsi',provinceChoices,required(field));if(n==='pegawai'&&field==='tingkat_biaya')return `<label>Tingkat Biaya Perjalanan Dinas<input name=tingkat_biaya type=text><small>Isi sesuai klasifikasi perjalanan dinas yang berlaku di satuan kerja.</small></label>`;return field==='role'?sel('role','Peran',ALL,true):MONEY_FIELDS.has(field)?moneyInp(field,label,''):inp(field,label,type,'',required(field))}).join('')}</div><button type=submit>Tambah / Simpan</button></form><div class=card id=t></div>`;
 if(n==='pegawai'){const golongan=$('[name=golongan]'),pangkat=$('[name=pangkat]'),jabatanChoice=$('[name=jabatan_pilihan]'),jabatanManual=$('[name=jabatan_manual]');const updatePangkat=()=>{const value=golongan.value;pangkat.innerHTML=`<option value="">${value?'Pilih pangkat':'Pilih golongan terlebih dahulu'}</option>`+(GOLONGAN_PANGKAT[value]?`<option value="${esc(GOLONGAN_PANGKAT[value])}">${esc(GOLONGAN_PANGKAT[value])}</option>`:'');pangkat.disabled=!value;pangkat.value=GOLONGAN_PANGKAT[value]||''};golongan.addEventListener('change',updatePangkat);updatePangkat();jabatanChoice.addEventListener('change',()=>{const manual=jabatanChoice.value==='__other__';jabatanManual.hidden=!manual;jabatanManual.required=manual;if(!manual)jabatanManual.value=''})}
 const T=()=>{const k=$('#q').value.toLowerCase();$('#t').innerHTML=table([['id','ID'],...c.filter(x=>x[0]!='password').map(x=>MONEY_FIELDS.has(x[0])?[x[0],x[1],row=>rp(row[x[0]])]:[x[0],x[1]]),['aktif','Aktif',r=>r.aktif===undefined?'':r.aktif?'Ya':'Tidak']],r.filter(x=>JSON.stringify(x).toLowerCase().includes(k)),n=='tarif'?null:r=>r.aktif===undefined?'':`<a href=# onclick="event.preventDefault();tg('${n}',${r.id},${r.aktif?0:1},${version},event)">${r.aktif?'Nonaktifkan':'Aktifkan'}</a>`)};T();$('#q').oninput=T;
 bindSubmit($('#f'),async e=>{const b=fd(e.target);if(n==='pegawai'){b.jabatan=b.jabatan_pilihan==='__other__'?b.jabatan_manual:b.jabatan_pilihan;delete b.jabatan_pilihan;delete b.jabatan_manual}Object.keys(b).forEach(k=>b[k]===''&&delete b[k]);await api('/ref/'+n,{body:b});toast('Tersimpan',1);await master(n,version)})}
window.tg=async(n,i,v,version=routeVersion,event)=>{const button=event?.currentTarget;if(button?.dataset.busy==='true')return;if(n==='users'&&!await confirmAppAction({title:v?'Aktifkan akun?':'Nonaktifkan akun?',description:v?'Pengguna akan dapat masuk kembali ke sistem.':'Pengguna tidak dapat masuk selama akun nonaktif.',confirmLabel:v?'Aktifkan akun':'Nonaktifkan akun',danger:!v}))return;if(button){button.dataset.busy='true';button.setAttribute('aria-disabled','true')}try{await api(`/ref/${n}/${i}`,{method:'PUT',body:{aktif:v}});if(version===routeVersion)await master(n,version)}catch(error){if(!error?.uiNotified)toast('Perubahan gagal. Coba lagi.')}finally{if(button){button.dataset.busy='false';button.removeAttribute('aria-disabled')}}};
R.satker=async(version)=>{const s=await api('/ref/satker');if(version!==routeVersion)return;$('#m').innerHTML=`<div class=bar><h2>Identitas Satker</h2></div><form class=card id=f><div class=g>${Object.keys(s).map(k=>inp(k,k.replace(/_/g,' '),k==='tanggal_dipa'?'date':'text',s[k])).join('')}</div><button type=submit>Simpan</button></form>`;bindSubmit($('#f'),async e=>{await api('/ref/satker',{method:'PUT',body:fd(e.target)});toast('Tersimpan',1)})};
R.audit=async(version)=>{const r=await api('/audit');if(version!==routeVersion)return;$('#m').innerHTML=`<div class=bar><h2>Audit Trail</h2></div><div class=card>${table([['waktu','Waktu WIB',row=>formatWib(row.waktu)],['pengguna','User'],['aksi','Aksi'],['entitas','Entitas'],['eid','ID'],['detail','Detail']],r)}</div>`};
